<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>后台管理</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07101f;color:#eef5ff;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}.wrap{max-width:1050px;margin:auto;padding:20px}.panel{background:#0d192c;border:1px solid #ffffff16;border-radius:18px;padding:20px;box-shadow:0 16px 40px #0005;margin-bottom:18px}.head{display:flex;justify-content:space-between;align-items:center}.head h1{font-size:23px;margin:0}.muted{color:#8fa2bf;font-size:13px}.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}.box{background:#ffffff06;border:1px solid #ffffff12;border-radius:12px;padding:15px}label{display:block;font-size:13px;color:#aebdd1;margin-top:10px}input,select{width:100%;margin-top:6px;padding:11px;border-radius:9px;background:#071225;color:#fff;border:1px solid #ffffff20}button{border:0;border-radius:9px;padding:10px 14px;font-weight:700;cursor:pointer}.primary{background:#3488ff;color:#fff;width:100%;margin-top:12px}.danger{background:#ef476f;color:#fff}.close{background:#ffffff12;color:#fff}.save{background:#3488ff;color:#fff}.preview{width:100%;height:110px;object-fit:cover;border-radius:10px;background:#071225;margin-top:8px}.game{border-top:1px solid #ffffff10;padding:14px 0}.grid{display:grid;grid-template-columns:60px 1fr 1.2fr 1.5fr 1.5fr 100px;gap:8px;align-items:center}.game img{width:52px;height:52px;border-radius:10px;object-fit:cover;background:#13213a}.actions{display:flex;gap:6px}.login{max-width:420px;margin:12vh auto}.hidden{display:none!important}@media(max-width:760px){.form{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr}.grid .wide{grid-column:1/-1}.game img{width:58px;height:58px}}
</style>
</head>
<body>
<div class="wrap">
  <section class="panel login" id="loginPanel">
    <div class="head"><h1>🔐 后台管理</h1></div>
    <p class="muted">请输入管理员密码</p>
    <input id="pw" type="password" placeholder="管理员密码" autocomplete="current-password">
    <button class="primary" onclick="login()">进入后台</button>
  </section>
  <div id="admin" class="hidden">
    <section class="panel">
      <div class="head"><div><h1>🎮 网站设置</h1><p class="muted">这里不会出现在网站首页，只能通过后台地址进入。</p></div><button class="close" onclick="location.href='/'">返回网站</button></div>
      <div class="form">
        <div class="box">
          <label>网站名称</label><input id="siteName">
          <label>主题颜色</label><input id="accent" type="color">
          <label>背景图片直链</label><input id="bgUrl" placeholder="https://..." oninput="document.getElementById('bgPreview').src=this.value">
          <img id="bgPreview" class="preview">
          <label>联系客服链接</label><input id="contactUrl" placeholder="https://...">
          <button class="primary" onclick="saveSite()">保存网站设置</button>
        </div>
        <div class="box"><h3>使用说明</h3><p class="muted">首页只显示网站名称、联系客服和游戏列表。</p><p class="muted">游戏的启动按钮会直接打开你填写的链接。图标和背景继续使用图片直链，不需要 R2。</p><p class="muted">以后换成你的自定义域名后，后台地址就是你的域名 + /admin。</p></div>
      </div>
    </section>
    <section class="panel"><div class="head"><div><h1>🎮 游戏管理</h1><p class="muted">修改名称、简介、图标直链、启动链接。</p></div><button class="save" onclick="addGame()">＋ 添加游戏</button></div><div id="games"></div></section>
  </div>
</div>
<script>
let data={settings:{},games:[]},token=sessionStorage.getItem('gameNavToken')||'';
function headers(){return {'content-type':'application/json','authorization':'Bearer '+token}}
async function api(url,opt={}){return fetch(url,opt)}
async function login(){const p=document.getElementById('pw').value;if(!p)return alert('请输入密码');const r=await api('/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:p})});if(!r.ok)return alert('密码错误');token=p;sessionStorage.setItem('gameNavToken',token);await load();}
async function load(){const r=await api('/api/site');data=await r.json();document.getElementById('loginPanel').classList.add('hidden');document.getElementById('admin').classList.remove('hidden');fill();renderGames();}
function fill(){const s=data.settings||{};document.getElementById('siteName').value=s.site_name||'游戏导航';document.getElementById('accent').value=s.accent||'#3488ff';document.getElementById('bgUrl').value=s.background_url||'';document.getElementById('bgPreview').src=s.background_url||'';document.getElementById('contactUrl').value=s.contact_url||'';}
async function saveSite(){const body={site_name:document.getElementById('siteName').value,accent:document.getElementById('accent').value,background_url:document.getElementById('bgUrl').value,logo_url:'',contact_url:document.getElementById('contactUrl').value};const r=await api('/api/site',{method:'PUT',headers:headers(),body:JSON.stringify(body)});if(!r.ok)return alert('保存失败');await load();alert('保存成功');}
function renderGames(){document.getElementById('games').innerHTML=(data.games||[]).map(g=>`<div class="game"><div class="grid"><img src="${esc(g.icon_url||'')}" onerror="this.style.visibility='hidden'"><input id="n${g.id}" value="${esc(g.name)}" placeholder="游戏名称"><input id="d${g.id}" value="${esc(g.description)}" placeholder="游戏简介"><input id="i${g.id}" value="${esc(g.icon_url)}" placeholder="图标直链"><input id="u${g.id}" value="${esc(g.game_url)}" placeholder="启动链接"><div class="actions"><button class="save" onclick="editGame(${g.id})">保存</button><button class="danger" onclick="delGame(${g.id})">删除</button></div></div></div>`).join('')||'<p class="muted">暂无游戏</p>';}
async function editGame(id){const old=data.games.find(x=>x.id===id)||{};const body={name:document.getElementById('n'+id).value,description:document.getElementById('d'+id).value,icon_url:document.getElementById('i'+id).value,game_url:document.getElementById('u'+id).value,category:old.category||'全部',sort_order:old.sort_order||0,enabled:1};const r=await api('/api/games/'+id,{method:'PUT',headers:headers(),body:JSON.stringify(body)});if(!r.ok)return alert('保存失败');await load();}
async function delGame(id){if(!confirm('确定删除这个游戏？'))return;const r=await api('/api/games/'+id,{method:'DELETE',headers:headers()});if(!r.ok)return alert('删除失败');await load();}
async function addGame(){const r=await api('/api/games',{method:'POST',headers:headers(),body:JSON.stringify({name:'新游戏',description:'填写游戏简介',icon_url:'',game_url:'#',category:'全部',sort_order:(data.games||[]).length+1})});if(!r.ok)return alert('添加失败');await load();}
function esc(s){return String(s??'').replaceAll('&','&amp;').replaceAll('"','&quot;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll("'",'&#39;')}
if(token){load().catch(()=>{sessionStorage.removeItem('gameNavToken');token=''})}
</script>
</body></html>
