<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="dark">
<title>Yukecil · 后台管理</title>
<style>
:root{--bg:#07051a;--bg2:#120d33;--glass:rgba(255,255,255,.055);--glass2:rgba(255,255,255,.1);--line:rgba(255,255,255,.11);--ink:#f5f2ff;--sub:#a7a1d3;--p:#7a5cff;--p2:#b79bff;--gold:#f1d28a;--bad:#ff6a85;--ok:#5be3b0}
*{box-sizing:border-box;margin:0}
html{background:var(--bg)}
body{min-height:100vh;color:var(--ink);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;overflow-x:hidden;padding:calc(14px + env(safe-area-inset-top,0px)) 14px calc(40px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(1.2px 1.2px at 12% 18%,#fff,transparent),radial-gradient(1px 1px at 78% 12%,#fff,transparent),radial-gradient(1.4px 1.4px at 90% 42%,#d9ccff,transparent),radial-gradient(1px 1px at 8% 55%,#fff,transparent),radial-gradient(1.2px 1.2px at 55% 70%,#d9ccff,transparent),radial-gradient(560px 360px at 90% -60px,rgba(122,92,255,.5),transparent 70%),radial-gradient(460px 340px at -15% 40%,rgba(60,150,255,.2),transparent 70%),linear-gradient(180deg,var(--bg),var(--bg2))}
.wrap{max-width:900px;margin:0 auto}.hidden{display:none!important}
.shine{background:linear-gradient(110deg,#c9b6ff 38%,#fff 50%,#c9b6ff 62%) 200% 0/250% 100% no-repeat,#c9b6ff;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:sh 2.8s ease-in-out infinite}
@keyframes sh{0%{background-position:200% 0,0 0}60%,100%{background-position:-100% 0,0 0}}
@media (prefers-reduced-motion:reduce){.shine{animation:none;background:none;-webkit-text-fill-color:#c9b6ff}}
.ic{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--gold);background:radial-gradient(circle at 30% 25%,#8b6bff,#3a2796 70%) padding-box,conic-gradient(from 200deg,#f6e3a8,#9a7a2e,#f6e3a8,#b8913d,#f6e3a8) border-box;border:2px solid transparent;box-shadow:0 8px 18px -6px rgba(122,92,255,.8),inset 0 2px 5px rgba(255,255,255,.35)}
.ic svg{width:54%;height:54%}.ic.lg{width:56px;height:56px}
/* login */
.login{max-width:400px;margin:12vh auto 0;text-align:center}
.card{position:relative;border-radius:24px;background:linear-gradient(180deg,rgba(255,255,255,.1),rgba(255,255,255,.035));border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 18px 40px -20px #000}
.card::before{content:"";position:absolute;left:22%;right:22%;top:0;height:2px;background:linear-gradient(90deg,transparent,var(--p2),transparent)}
.login .card{padding:30px 22px}.login .ic{margin:0 auto 14px}
.login h1{font-size:28px;letter-spacing:1px}.login p{color:var(--sub);font-size:13px;margin:6px 0 20px;letter-spacing:2px}
/* topbar */
.topbar{position:sticky;top:calc(8px + env(safe-area-inset-top,0px));z-index:20;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;margin-bottom:16px;border-radius:22px;background:rgba(22,16,58,.78);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 14px 34px -12px #000}
.tl{display:flex;align-items:center;gap:10px;min-width:0}.tl b{display:block;font-size:17px}.tl small{display:block;color:var(--sub);font-size:11px;margin-top:2px}
.ta{display:flex;gap:8px;flex:none}
/* controls */
label{display:block;color:var(--sub);font-size:12px;margin:14px 0 7px}
input,select{width:100%;height:46px;padding:0 14px;color:var(--ink);background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:14px;font:inherit;font-size:15px;outline:0;transition:.2s}
select option{background:#1a1442;color:#fff}
input::placeholder{color:#7e78aa}
input:focus,select:focus{border-color:var(--p2);box-shadow:0 0 0 3px rgba(122,92,255,.25)}
input[type=color]{padding:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:42px;padding:0 18px;border:1px solid var(--line);border-radius:999px;color:#fff;font:600 14px inherit;font-family:inherit;text-decoration:none;cursor:pointer;background:var(--glass2);transition:.15s}
.btn:active{transform:scale(.96)}
.btn.pri{border:0;background:linear-gradient(135deg,var(--p2),var(--p));box-shadow:0 8px 18px -8px var(--p),inset 0 1px 0 rgba(255,255,255,.35)}
.btn.bad{color:var(--bad);background:rgba(255,106,133,.1);border-color:rgba(255,106,133,.25)}
.btn.gold{color:var(--gold);background:rgba(241,210,138,.1);border-color:rgba(241,210,138,.28)}
.btn.sm{height:34px;padding:0 14px;font-size:13px}.btn.full{width:100%;margin-top:18px}
/* sections */
.panel{padding:18px;margin-bottom:16px}
.sh{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px}
.st{display:flex;align-items:center;gap:12px;min-width:0}.st h2{font-size:18px;letter-spacing:.5px}.st p{font-size:12px;color:var(--sub);margin-top:3px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:6px}
.box{padding:4px 16px 16px;border-radius:18px;background:rgba(255,255,255,.03);border:1px solid var(--line)}
.box h3{font-size:14px;color:var(--gold);margin-top:14px;letter-spacing:1px}
.preview{width:100%;max-height:260px;margin-top:10px;object-fit:contain;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
.tip{margin-top:12px;padding:11px 13px;font-size:12px;line-height:1.7;color:var(--sub);border-radius:12px;background:rgba(122,92,255,.1);border:1px solid rgba(122,92,255,.22)}
.link{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12px;color:var(--sub);min-height:20px}
.link a{color:var(--ok);text-decoration:none;word-break:break-all}
.save{display:flex;justify-content:flex-end;margin-top:16px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.stat{padding:14px 10px;text-align:center;border-radius:16px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
.stat small{color:var(--sub);font-size:11px}.stat strong{display:block;margin-top:6px;font-size:24px;color:var(--gold)}
/* games */
.game{padding:14px;margin-top:12px;border-radius:20px;background:rgba(255,255,255,.035);border:1px solid var(--line)}
.gh{display:flex;align-items:center;gap:12px}
.gi{flex:none;width:58px;height:58px;border-radius:18px;overflow:hidden;display:grid;place-items:center;color:#fff;background:linear-gradient(150deg,#9a7aff,#4a2fb5);box-shadow:0 10px 20px -8px #7a5cff,inset 0 1px 0 rgba(255,255,255,.5)}
.gi img{width:100%;height:100%;object-fit:cover}.gi svg{width:50%;height:50%}
.gh input{flex:1;min-width:0;font-weight:700}
.gg{display:grid;grid-template-columns:1fr 1fr;gap:10px}.gg .wide{grid-column:1/-1}
.gg label{margin:12px 0 6px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;flex-wrap:wrap}
.sw{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink);margin:0;cursor:pointer}
.sw input{display:none}.sw i{position:relative;width:46px;height:26px;border-radius:99px;background:rgba(255,255,255,.14);transition:.2s}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.sw input:checked+i{background:linear-gradient(135deg,var(--p2),var(--p))}.sw input:checked+i::after{left:23px}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{padding:5px 10px;border-radius:99px;font-size:11px;color:var(--sub);background:var(--glass);border:1px solid var(--line)}
.acts{display:flex;gap:8px;margin-top:14px}.acts .btn{flex:1}
.empty{text-align:center;color:var(--sub);padding:34px 10px;font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);opacity:0;padding:12px 20px;border-radius:99px;font-size:14px;font-weight:600;background:rgba(22,16,58,.95);border:1px solid var(--gold);box-shadow:0 14px 34px -8px #000;transition:.25s;z-index:50;pointer-events:none;max-width:90vw}
.toast.on{opacity:1;transform:translate(-50%,0)}.toast.err{border-color:var(--bad);color:var(--bad)}
@media(max-width:640px){.g2{grid-template-columns:1fr}.gg{grid-template-columns:1fr}.ta .btn.v{display:none}.stats{gap:8px}.stat strong{font-size:20px}}

/* ===== 宽松布局 ===== */
.wrap{max-width:680px}
.seg{display:flex;gap:6px;padding:5px;margin-bottom:20px;border-radius:999px;background:var(--glass);border:1px solid var(--line)}
.seg button{flex:1;height:40px;border:0;border-radius:999px;background:none;color:var(--sub);font:600 14px inherit;font-family:inherit;cursor:pointer;transition:.2s}
.seg button.on{color:var(--gold);background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.05))}
.blk{padding:24px 22px 26px;margin-bottom:20px}
.blk .st{margin-bottom:8px}
label{margin:22px 0 9px;font-size:13px}
input,select{height:50px;border-radius:16px}
.tip{margin-top:16px;padding:14px 16px}
.preview{margin-top:16px}.link{margin-top:10px}
.stats{margin-top:20px;gap:12px}.stat{padding:20px 8px}
.save{margin:4px 0 24px}.save .btn{width:100%;height:50px;font-size:16px}
.game{padding:0;margin-bottom:14px;overflow:hidden}
.gtop{display:flex;align-items:center;gap:14px;width:100%;padding:16px 18px;border:0;background:none;color:inherit;font:inherit;text-align:left;cursor:pointer}
.gm{flex:1;min-width:0}.gm b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gm small{display:block;margin-top:5px;font-size:12px;color:var(--sub)}
.sdot{flex:none;width:9px;height:9px;border-radius:50%;background:#6f6a99}.sdot.ok{background:var(--ok);box-shadow:0 0 10px var(--ok)}
.chev{flex:none;color:var(--sub);font-size:24px;line-height:1;transition:.2s}.game.open .chev{transform:rotate(90deg)}
.gbody{display:none;padding:2px 20px 22px;border-top:1px solid var(--line)}.game.open .gbody{display:block}
.gg{display:block}.gg>div{margin:0}.gg label{margin:20px 0 9px}
.row{margin-top:22px}.acts{margin-top:22px}
.empty{padding:40px 10px}
@media(max-width:640px){.wrap{max-width:none}.blk{padding:22px 18px 24px}}
</style></head><body>

oin="round" d="M6 15h8l3-5h14l3 5h8v24H6z"/><circle fill="currentColor" fill-opacity=".2" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" cx="24" cy="26" r="7"/></symbol><symbol id="i-home" viewBox="0 0 48 48"><path fill="currentColor" fill-opacity=".2" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" d="M6 22L24 7l18 15"/><path fill="currentColor" fill-opacity=".2" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" d="M11 19v21h26V19"/><path fill="currentColor" fill-opacity=".2" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" d="M20 40V28h8v12"/></symbol><symbol id="i-headset" viewBox="0 0 48 48"><path fill="currentColor" fill-opacity=".2" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" d="M8 28v-4a16 16 0 0 1 32 0v4"/><rect fill="currentColor" fill-opacity=".2" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" x="6" y="26" width="9" height="13" rx="3"/><rect fill="currentColor" fill-opacity=".2" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" x="33" y="26" width="9" height="13" rx="3"/><path fill="currentColor" fill-opacity=".2" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" d="M37 39c0 4-5 5-10 5"/></symbol><symbol id="i-search" viewBox="0 0 48 48"><circle fill="currentColor" fill-opacity=".2" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" cx="21" cy="21" r="13"/><path fill="currentColor" fill-opacity=".2" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" d="M31 31l11 11"/></symbol></svg>
<div class="wrap">
<section class="login" id="loginPanel"><div class="card">
<div class="ic lg"><svg><use href="#i-tools"/></svg></div>
<h1><span class="shine">Yukecil</span></h1><p>导航站 · 管理后台</p>
<input id="pw" type="password" placeholder="管理员密码" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()">
<button class="btn pri full" onclick="login()">进入后台</button>
</div></section>

<div id="admin" class="hidden">
<header class="topbar"><div class="tl"><div class="ic"><svg><use href="#i-tools"/></svg></div><div><b class="shine">Yukecil 控制中心</b><small>网站内容 · 客服 · 公告 · 站点管理</small></div></div>
<div class="ta"><button class="btn sm v" onclick="location.href='/'">查看首页</button><button class="btn sm bad" onclick="logout()">退出</button></div></header>

<nav class="seg" id="seg"><button data-t="look" class="on">外观</button><button data-t="cs">客服</button><button data-t="sites">站点</button><button data-t="stats">概览</button></nav>

<section class="panel" data-p="look">
<div class="card blk"><div class="st"><div class="ic"><svg><use href="#i-palette"/></svg></div><div><h2>基础外观</h2><p>名称、主题色与背景</p></div></div>
<label>网站名称</label><input id="siteName" placeholder="例如：Yukecil导航">
<label>主题颜色</label><input id="accent" type="color">
<label>背景图片直链</label><input id="bgUrl" placeholder="https://..." oninput="pv('bgUrl','bgPreview')">
<img id="bgPreview" class="preview" alt="" onerror="this.style.visibility='hidden'" onload="this.style.visibility='visible'"></div>
<div class="card blk"><div class="st"><div class="ic"><svg><use href="#i-note"/></svg></div><div><h2>首页大图与公告</h2><p>主页顶部展示的内容</p></div></div>
<label>首页大图直链</label><input id="announcementImageUrl" placeholder="https://..." oninput="pv('announcementImageUrl','announcementPreview')">
<img id="announcementPreview" class="preview" alt="" onerror="this.style.visibility='hidden'" onload="this.style.visibility='visible'">
<label>滚动公告文字</label><input id="announcementText" placeholder="这里填写公告文字"></div>
<div class="save"><button class="btn pri" onclick="saveSite()">保存设置</button></div>
</section>

<section class="panel hidden" data-p="cs">
<div class="card blk"><div class="st"><div class="ic"><svg><use href="#i-globe"/></svg></div><div><h2>Telegram</h2><p>只填 ID，自动生成官方链接</p></div></div>
<div class="tip">例如填 <b>Yukecil1</b>，保存后自动变成 t.me/Yukecil1。粘贴完整链接也会自动识别。</div>
<label>飞机联系方式</label><input id="telegramContact" placeholder="Yukecil1" oninput="tgPrev('telegramContact','lk1')"><div class="link" id="lk1"></div>
<label>飞机交流群</label><input id="telegramGroup" placeholder="群 ID 或邀请链接" oninput="tgPrev('telegramGroup','lk2')"><div class="link" id="lk2"></div>
<label>双向机器人</label><input id="telegramBot" placeholder="机器人 ID，如 xxx_bot" oninput="tgPrev('telegramBot','lk3')"><div class="link" id="lk3"></div>
<label>备用客服链接（可留空）</label><input id="contactUrl" placeholder="https://..."></div>
<div class="card blk"><div class="st"><div class="ic"><svg><use href="#i-headset"/></svg></div><div><h2>邮箱与服务时间</h2><p>显示在主页客服页面</p></div></div>
<label>客服邮箱</label><input id="email" type="email" placeholder="service@example.com">
<label>服务时间</label><input id="serviceTime" placeholder="每天 10:00 - 22:00"></div>
<div class="save"><button class="btn pri" onclick="saveSite()">保存设置</button></div>
</section>

<section class="panel hidden" data-p="sites">
<div class="card blk"><div class="st"><div class="ic"><svg><use href="#i-laptop"/></svg></div><div style="flex:1"><h2>站点管理</h2><p>点击卡片展开编辑</p></div><button class="btn pri sm" onclick="addGame()">＋ 添加</button></div></div>
<div id="games"></div>
</section>

<section class="panel hidden" data-p="stats">
<div class="card blk"><div class="st"><div class="ic"><svg><use href="#i-chart"/></svg></div><div><h2>数据概览</h2><p>站点点击统计</p></div></div>
<div class="stats"><div class="stat"><small>站点数量</small><strong id="statGames">0</strong></div><div class="stat"><small>总点击</small><strong id="statLaunches">0</strong></div><div class="stat"><small>今日点击</small><strong id="statToday">0</strong></div></div></div>
</section>
</div></div>
<div class="toast" id="toast"></div>

<script>
let data={settings:{},games:[]};
let token=sessionStorage.getItem('gameNavToken')||'';
const CATS=['全部','游戏','AI','设计','开发','素材','学习','效率','数据','娱乐','工具'];
const ICONS={AI:'globe',设计:'palette',开发:'laptop',素材:'camera',学习:'book',效率:'note',数据:'chart',娱乐:'phones',工具:'tools'};
const $=id=>document.getElementById(id);
const headers=()=>({'content-type':'application/json','authorization':'Bearer '+token});
const api=(u,o={})=>fetch(u,o);
let tt;function toast(m,err){const t=$('toast');t.textContent=m;t.className='toast on'+(err?' err':'');clearTimeout(tt);tt=setTimeout(()=>t.className='toast',2200)}

/* Telegram：只填 ID 自动生成官方链接 */
function tgId(v){let x=String(v||'').trim();if(!x)return'';
 x=x.replace(/^tg:\/\/resolve\?domain=/i,'').replace(/^(https?:\/\/)?(www\.)?(t\.me|telegram\.me|telegram\.dog)\//i,'').replace(/^@/,'');
 x=x.split(/[?#]/)[0].replace(/\/+$/,'');
 if(/^(\+|joinchat\/)/i.test(x))return x;return x.split('/')[0]}
function tgNorm(v){const x=String(v||'').trim();if(!x)return'';
 if(/^https?:\/\//i.test(x)&&!/(t\.me|telegram\.(me|dog))\//i.test(x))return x;
 const id=tgId(x);if(!id)return'';return /^(\+|joinchat\/)/i.test(id)?'https://t.me/'+id:'@'+id}
function tgLink(v){const n=tgNorm(v);if(!n)return'';return n.startsWith('@')?'https://t.me/'+n.slice(1):n}
function tgPrev(inp,box){const l=tgLink($(inp).value);
 $(box).innerHTML=l?'官方链接：<a href="'+esc(l)+'" target="_blank" rel="noopener">'+esc(l)+'</a>':''}

async function login(){const p=$('pw').value.trim();if(!p){toast('请输入密码',1);return}
 try{const r=await api('/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:p})});
 if(!r.ok){toast('密码错误',1);return}token=p;sessionStorage.setItem('gameNavToken',token);await load()}catch(e){toast('登录失败，请检查网络',1)}}
function logout(){sessionStorage.removeItem('gameNavToken');token='';location.reload()}
async function load(){try{const r=await api('/api/site',{headers:headers()});if(!r.ok)throw 0;data=await r.json();
 $('loginPanel').classList.add('hidden');$('admin').classList.remove('hidden');fill();renderGames();renderStats()}
 catch(e){sessionStorage.removeItem('gameNavToken');token='';$('loginPanel').classList.remove('hidden');$('admin').classList.add('hidden')}}
function pv(i,p){$(p).src=$(i).value.trim()}
function fill(){const s=data.settings||{};
 $('siteName').value=s.site_name||'Yukecil导航';$('accent').value=s.accent||'#7a5cff';
 $('bgUrl').value=s.background_url||'';$('bgPreview').src=s.background_url||'';
 $('contactUrl').value=s.contact_url||'';
 $('announcementImageUrl').value=s.announcement_image_url||'';$('announcementPreview').src=s.announcement_image_url||'';
 $('announcementText').value=s.announcement_text||'';
 $('telegramContact').value=s.telegram_contact||'';$('telegramGroup').value=s.telegram_group||'';$('telegramBot').value=s.telegram_bot||'';
 $('email').value=s.email||'';$('serviceTime').value=s.service_time||'';
 tgPrev('telegramContact','lk1');tgPrev('telegramGroup','lk2');tgPrev('telegramBot','lk3')}
async function saveSite(){
 const v=i=>$(i).value.trim();
 const body={site_name:v('siteName'),accent:$('accent').value,background_url:v('bgUrl'),logo_url:'',contact_url:v('contactUrl'),
  announcement_image_url:v('announcementImageUrl'),announcement_text:v('announcementText'),
  telegram_contact:tgNorm(v('telegramContact')),telegram_group:tgNorm(v('telegramGroup')),telegram_bot:tgNorm(v('telegramBot')),
  email:v('email'),service_time:v('serviceTime')};
 const r=await api('/api/site',{method:'PUT',headers:headers(),body:JSON.stringify(body)});
 if(!r.ok){const m=await r.text().catch(()=>'');toast('保存失败'+(m?'：'+m:''),1);return}
 await load();toast('保存成功')}
function renderStats(){const g=data.games||[];
 $('statGames').textContent=g.length;
 $('statLaunches').textContent=g.reduce((n,x)=>n+Number(x.total_launches||0),0);
 $('statToday').textContent=g.reduce((n,x)=>n+Number(x.today_launches||0),0)}
function giInner(g){return g.icon_url?'<img src="'+esc(g.icon_url)+'" alt="" onerror="this.remove()">':'<svg><use href="#i-'+(ICONS[g.category]||'globe')+'"/></svg>'}
function renderGames(){const box=$('games'),games=data.games||[],openIds=[...document.querySelectorAll('.game.open')].map(e=>e.id);
 if(!games.length){box.innerHTML='<div class="card blk empty">暂无站点，点击上方“＋ 添加”开始。</div>';return}
 box.innerHTML=games.map(g=>{const on=Number(g.enabled)===1,cats=CATS.includes(g.category)?CATS:[...CATS,g.category].filter(Boolean);
 return `<div class="card game ${openIds.includes('g'+g.id)?'open':''}" id="g${g.id}"><button class="gtop" onclick="tog(${g.id})"><div class="gi" id="gi${g.id}">${giInner(g)}</div><div class="gm"><b>${esc(g.name)||'未命名'}</b><small>${esc(g.category||'全部')} · 总点击 ${Number(g.total_launches||0)}</small></div><span class="sdot ${on?'ok':''}"></span><span class="chev">›</span></button>
 <div class="gbody"><div class="gg"><div><label>站点名称</label><input id="n${g.id}" value="${esc(g.name)}" placeholder="站点名称"></div>
 <div><label>简介</label><input id="d${g.id}" value="${esc(g.description)}" placeholder="一句话简介"></div>
 <div><label>图标直链（留空使用默认图标）</label><input id="i${g.id}" value="${esc(g.icon_url)}" placeholder="https://..." oninput="updateIcon(${g.id})"></div>
 <div><label>跳转链接</label><input id="u${g.id}" value="${esc(g.game_url)}" placeholder="https://..."></div>
 <div><label>分类</label><select id="c${g.id}">${cats.map(c=>`<option value="${esc(c)}" ${g.category===c?'selected':''}>${esc(c)}</option>`).join('')}</select></div>
 <div><label>排序（越小越靠前）</label><input id="s${g.id}" type="number" value="${Number(g.sort_order||0)}"></div></div>
 <div class="row"><label class="sw" style="margin:0"><input id="e${g.id}" type="checkbox" ${on?'checked':''} onchange="$('t${g.id}').textContent=this.checked?'已上架':'已下架'"><i></i><span id="t${g.id}">${on?'已上架':'已下架'}</span></label><div class="chips"><span class="chip">今日 ${Number(g.today_launches||0)}</span></div></div>
 <div class="acts"><button class="btn pri" onclick="editGame(${g.id})">保存</button><a class="btn gold" href="${esc(g.game_url||'#')}" target="_blank" rel="noopener">测试</a><button class="btn bad" onclick="delGame(${g.id})">删除</button></div></div></div>`}).join('')}
function tog(id){$('g'+id).classList.toggle('open')}
function show(t){document.querySelectorAll('[data-p]').forEach(p=>p.classList.toggle('hidden',p.dataset.p!==t));document.querySelectorAll('#seg button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));sessionStorage.setItem('adminTab',t);scrollTo(0,0)}
document.querySelectorAll('#seg button').forEach(b=>b.onclick=()=>show(b.dataset.t));
show(sessionStorage.getItem('adminTab')||'look');
function updateIcon(id){const g={icon_url:$('i'+id).value.trim(),category:$('c'+id).value};$('gi'+id).innerHTML=giInner(g)}
async function editGame(id){const en=$('e'+id).checked;
 const body={name:$('n'+id).value.trim(),description:$('d'+id).value.trim(),icon_url:$('i'+id).value.trim(),game_url:$('u'+id).value.trim(),category:$('c'+id).value,sort_order:Number($('s'+id).value||0),enabled:en};
 const r=await api('/api/games/'+id,{method:'PUT',headers:headers(),body:JSON.stringify(body)});
 if(!r.ok){toast('保存失败',1);return}await load();toast(en?'已保存并上架':'已保存并下架')}
async function addGame(){const r=await api('/api/games',{method:'POST',headers:headers(),body:JSON.stringify({name:'新站点',description:'填写简介',icon_url:'',game_url:'#',category:'全部',sort_order:(data.games||[]).length+1})});
 if(!r.ok){toast('添加失败',1);return}await load();toast('已添加')}
async function delGame(id){if(!confirm('确定删除这个站点？'))return;
 const r=await api('/api/games/'+id,{method:'DELETE',headers:headers()});if(!r.ok){toast('删除失败',1);return}await load();toast('已删除')}
function esc(s){return String(s??'').replaceAll('&','&amp;').replaceAll('"','&quot;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll("'",'&#39;')}
if(token){load().catch(()=>{sessionStorage.removeItem('gameNavToken');token=''})}
</script></body></html>
