<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Yukecil · 后台管理</title>
<style>
*{box-sizing:border-box}
:root{
  --bg:#050914;
  --panel:rgba(10,18,38,.78);
  --panel2:rgba(13,24,50,.72);
  --line:rgba(130,160,255,.18);
  --line2:rgba(91,123,255,.28);
  --text:#f4f7ff;
  --muted:#91a1c0;
  --blue:#3488ff;
  --cyan:#42d9ff;
  --purple:#8b5cff;
  --danger:#ff4f79;
  --shadow:0 22px 60px rgba(0,0,0,.42);
}
html{min-height:100%;background:var(--bg)}
body{
  margin:0;
  min-height:100vh;
  color:var(--text);
  font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  background:
    radial-gradient(circle at 15% 10%,rgba(77,66,255,.22),transparent 30%),
    radial-gradient(circle at 88% 16%,rgba(0,180,255,.13),transparent 26%),
    radial-gradient(circle at 50% 100%,rgba(120,45,255,.14),transparent 35%),
    linear-gradient(180deg,#050817,#071225 52%,#040713);
  overflow-x:hidden;
}
body:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:.6;
  background-image:
    radial-gradient(circle at 8% 18%,#fff 0 1px,transparent 1.5px),
    radial-gradient(circle at 24% 70%,#8bdcff 0 1px,transparent 1.5px),
    radial-gradient(circle at 42% 26%,#fff 0 1px,transparent 1.4px),
    radial-gradient(circle at 67% 12%,#bda5ff 0 1px,transparent 1.5px),
    radial-gradient(circle at 82% 66%,#fff 0 1px,transparent 1.4px),
    radial-gradient(circle at 94% 34%,#7adfff 0 1px,transparent 1.5px);
  background-size:180px 180px,240px 240px,210px 210px,270px 270px,230px 230px,190px 190px;
}
button,input,select{font:inherit}
button{cursor:pointer}
.wrap{max-width:1180px;margin:auto;padding:22px}
.hidden{display:none!important}

.login{
  width:min(430px,100%);
  margin:11vh auto 0;
}
.login-card{
  position:relative;
  overflow:hidden;
  padding:30px;
  border:1px solid var(--line2);
  border-radius:26px;
  background:linear-gradient(145deg,rgba(16,28,59,.9),rgba(7,14,31,.9));
  box-shadow:var(--shadow),0 0 70px rgba(66,102,255,.1);
}
.login-card:after{
  content:"";
  position:absolute;
  width:240px;height:240px;
  right:-120px;top:-140px;
  border-radius:50%;
  background:radial-gradient(circle,rgba(80,175,255,.22),transparent 68%);
}
.brand{
  display:flex;
  align-items:center;
  gap:13px;
}
.brand-mark{
  width:48px;height:48px;
  display:grid;place-items:center;
  border-radius:15px;
  background:linear-gradient(145deg,#388cff,#694eff);
  box-shadow:0 0 28px rgba(65,123,255,.4);
  font-size:23px;
}
.brand h1{margin:0;font-size:24px;letter-spacing:.3px}
.muted{color:var(--muted);font-size:13px;line-height:1.7}
.login .muted{margin:7px 0 20px}
.field{margin-top:14px}
label{
  display:block;
  color:#b9c7df;
  font-size:12px;
  margin-bottom:7px;
}
input,select,textarea{
  width:100%;
  color:#f5f8ff;
  background:rgba(3,9,23,.78);
  border:1px solid rgba(137,164,230,.18);
  border-radius:12px;
  padding:12px 13px;
  outline:none;
  transition:.2s;
}
textarea{min-height:92px;resize:vertical}
input:focus,select:focus,textarea:focus{
  border-color:rgba(66,217,255,.58);
  box-shadow:0 0 0 3px rgba(66,217,255,.08),0 0 24px rgba(55,116,255,.08);
}
input[type=color]{height:46px;padding:4px}
.btn{
  border:1px solid transparent;
  border-radius:11px;
  padding:10px 14px;
  font-weight:750;
  color:#fff;
  transition:.18s;
}
.btn:hover{transform:translateY(-1px)}
.btn-primary{
  background:linear-gradient(135deg,#3488ff,#6453ff);
  box-shadow:0 8px 26px rgba(52,136,255,.2);
}
.btn-soft{
  background:rgba(255,255,255,.06);
  border-color:rgba(255,255,255,.09);
}
.btn-danger{
  background:rgba(255,79,121,.12);
  color:#ff9bb3;
  border-color:rgba(255,79,121,.22);
}
.btn-cyan{
  background:rgba(66,217,255,.1);
  color:#8beaff;
  border-color:rgba(66,217,255,.22);
}
.full{width:100%;margin-top:18px}

.topbar{
  position:sticky;
  top:12px;
  z-index:20;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:18px;
  margin-bottom:18px;
  padding:14px 16px;
  border:1px solid var(--line);
  border-radius:20px;
  background:rgba(6,13,29,.78);
  backdrop-filter:blur(18px);
  box-shadow:0 14px 40px rgba(0,0,0,.22);
}
.top-left{display:flex;align-items:center;gap:12px;min-width:0}
.logo-dot{
  width:40px;height:40px;border-radius:13px;
  display:grid;place-items:center;
  background:linear-gradient(145deg,#328dff,#7854ff);
  box-shadow:0 0 25px rgba(71,125,255,.35);
}
.top-title{min-width:0}
.top-title strong{display:block;font-size:17px}
.top-title span{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.top-actions{display:flex;gap:8px}

.panel{
  position:relative;
  overflow:hidden;
  margin-bottom:18px;
  padding:20px;
  border:1px solid var(--line);
  border-radius:22px;
  background:linear-gradient(145deg,rgba(12,23,47,.86),rgba(7,14,30,.78));
  box-shadow:var(--shadow);
}
.panel:before{
  content:"";
  position:absolute;
  left:0;top:0;width:180px;height:1px;
  background:linear-gradient(90deg,#49d9ff,transparent);
  box-shadow:0 0 14px #49d9ff;
}
.section-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:18px;
}
.section-title{
  display:flex;align-items:center;gap:10px;
}
.section-icon{
  width:38px;height:38px;border-radius:12px;
  display:grid;place-items:center;
  background:linear-gradient(145deg,rgba(55,142,255,.2),rgba(119,80,255,.2));
  border:1px solid rgba(91,139,255,.25);
}
.section-title h2{margin:0;font-size:18px}
.section-title p{margin:3px 0 0;color:var(--muted);font-size:12px}

.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.box{
  padding:16px;
  border:1px solid rgba(126,153,221,.13);
  border-radius:16px;
  background:rgba(255,255,255,.025);
}
.box-title{
  display:flex;align-items:center;gap:8px;
  margin:0 0 10px;font-size:14px;
}
.preview{
  width:100%;
  height:130px;
  margin-top:8px;
  object-fit:cover;
  border-radius:13px;
  background:#050b18;
  border:1px solid rgba(126,153,221,.13);
}
.tip{
  margin-top:12px;
  padding:11px 12px;
  color:#9eb8dc;
  font-size:12px;
  line-height:1.7;
  border:1px solid rgba(52,136,255,.18);
  border-radius:12px;
  background:rgba(52,136,255,.06);
}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.save-row{margin-top:15px;display:flex;justify-content:flex-end}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}
.stat{
  padding:13px;
  border-radius:14px;
  background:rgba(255,255,255,.035);
  border:1px solid rgba(126,153,221,.13);
}
.stat small{color:var(--muted);font-size:11px}
.stat strong{display:block;margin-top:4px;font-size:21px}

.contact-card{
  display:flex;
  align-items:center;
  gap:12px;
}
.contact-icon{
  width:42px;height:42px;flex:none;
  display:grid;place-items:center;
  border-radius:13px;
  background:linear-gradient(145deg,rgba(47,150,255,.18),rgba(123,80,255,.18));
  border:1px solid rgba(74,160,255,.25);
  font-size:19px;
}
.contact-copy{min-width:0;flex:1}
.contact-copy b{display:block;font-size:13px}
.contact-copy span{display:block;color:var(--muted);font-size:11px;margin-top:3px}

.game{
  padding:17px 0;
  border-top:1px solid rgba(255,255,255,.08);
}
.game:first-child{border-top:0}
.game-grid{
  display:grid;
  grid-template-columns:70px 1fr 1fr;
  gap:13px;
  align-items:start;
}
.game-icon{
  width:62px;height:62px;
  border-radius:16px;
  object-fit:cover;
  background:#101d35;
  border:1px solid rgba(126,153,221,.16);
  box-shadow:0 8px 25px rgba(0,0,0,.2);
}
.game-fields{display:grid;gap:9px}
.game-actions{
  grid-column:1/-1;
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:8px;
  flex-wrap:wrap;
}
.status{
  display:flex;
  align-items:center;
  gap:9px;
  width:max-content;
  max-width:100%;
  padding:9px 11px;
  border-radius:11px;
  background:rgba(3,9,23,.7);
  border:1px solid rgba(137,164,230,.15);
}
.status input{width:auto;margin:0}
.status label{margin:0;color:#eaf1ff;font-size:12px}
.sort{max-width:130px}
.game-stats{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:2px;
}
.game-stat{
  padding:6px 9px;
  border-radius:9px;
  color:#a9bbd8;
  font-size:11px;
  background:rgba(255,255,255,.035);
  border:1px solid rgba(126,153,221,.1);
}

.empty{
  text-align:center;
  padding:35px 10px;
  color:var(--muted);
}

@media(max-width:820px){
  .grid-2,.grid-3{grid-template-columns:1fr}
  .game-grid{grid-template-columns:62px 1fr}
}
@media(max-width:600px){
  .wrap{padding:12px}
  .panel{padding:15px;border-radius:18px}
  .topbar{top:7px;border-radius:16px;padding:11px}
  .top-actions .btn-soft{display:none}
  .section-head{align-items:flex-start}
  .section-head>.btn{white-space:nowrap}
  .stats{grid-template-columns:1fr 1fr}
  .game-fields{grid-column:1/-1}
  .game-actions{justify-content:stretch}
  .game-actions .btn,.game-actions a{flex:1;text-align:center}
}
@media(max-width:430px){
  .top-title span{display:none}
  .section-head{flex-direction:column}
  .section-head>.btn{width:100%}
  .stats{grid-template-columns:1fr}
}
</style>
</head>

<body>

<div class="wrap">

  <!-- 登录 -->
  <section class="login" id="loginPanel">
    <div class="login-card">
      <div class="brand">
        <div class="brand-mark">✦</div>
        <div>
          <h1>Yukecil</h1>
          <div class="muted">导航站 · 管理后台</div>
        </div>
      </div>
      <p class="muted">输入管理员密码进入控制中心</p>
      <input id="pw" type="password" placeholder="管理员密码"
             autocomplete="current-password"
             onkeydown="if(event.key==='Enter')login()">
      <button class="btn btn-primary full" onclick="login()">进入后台</button>
    </div>
  </section>

  <!-- 后台 -->
  <div id="admin" class="hidden">

    <header class="topbar">
      <div class="top-left">
        <div class="logo-dot">✦</div>
        <div class="top-title">
          <strong>Yukecil 控制中心</strong>
          <span>网站内容、客服、公告与游戏管理</span>
        </div>
      </div>
      <div class="top-actions">
        <button class="btn btn-soft" onclick="location.href='/'">查看首页</button>
        <button class="btn btn-danger" onclick="logout()">退出登录</button>
      </div>
    </header>

    <!-- 网站设置 -->
    <section class="panel">
      <div class="section-head">
        <div class="section-title">
          <div class="section-icon">⚙️</div>
          <div>
            <h2>网站设置</h2>
            <p>控制主页面基础视觉与联系方式</p>
          </div>
        </div>
        <div class="muted">后台修改 · 首页同步</div>
      </div>

      <div class="grid-2">

        <div class="box">
          <h3 class="box-title">🎨 基础外观</h3>

          <div class="field">
            <label>网站名称</label>
            <input id="siteName" placeholder="例如：Yukecil导航">
          </div>

          <div class="field">
            <label>主题颜色</label>
            <input id="accent" type="color">
          </div>

          <div class="field">
            <label>背景图片直链</label>
            <input id="bgUrl" placeholder="https://..." oninput="previewBg()">
          </div>

          <img id="bgPreview" class="preview" alt="背景预览">

          <div class="field">
            <label>联系客服链接</label>
            <input id="contactUrl" placeholder="https://t.me/...">
          </div>
        </div>

        <div class="box">
          <h3 class="box-title">📢 公告设置</h3>

          <div class="field">
            <label>公告图片直链</label>
            <input id="announcementImageUrl" placeholder="https://..." oninput="previewAnnouncement()">
          </div>

          <img id="announcementPreview" class="preview" alt="公告图片预览">

          <div class="field">
            <label>公告图片下面的文字</label>
            <input id="announcementText" placeholder="这里填写公告文字">
          </div>

          <div class="tip">
            公告文字可以随时在这里修改，首页读取后台保存的数据。
          </div>
        </div>

      </div>

      <div class="grid-2" style="margin-top:14px">

        <div class="box">
          <h3 class="box-title">✈️ Telegram 客服</h3>

          <div class="field">
            <label>飞机联系方式</label>
            <input id="telegramContact" placeholder="@Yukecil1">
          </div>

          <div class="field">
            <label>飞机交流群</label>
            <input id="telegramGroup" placeholder="@yuk88888">
          </div>

          <div class="field">
            <label>双向机器人</label>
            <input id="telegramBot" placeholder="@Sx1108_bot">
          </div>
        </div>

        <div class="box">
          <h3 class="box-title">📧 客服与服务时间</h3>

          <div class="field">
            <label>客服邮箱</label>
            <input id="email" type="email" placeholder="service@example.com">
          </div>

          <div class="field">
            <label>服务时间</label>
            <input id="serviceTime" placeholder="每天 10:00 - 22:00">
          </div>

          <div class="tip">
            这些内容保存后由主页客服区域读取，不需要写死在 HTML 里。
          </div>
        </div>

      </div>

      <div class="save-row">
        <button class="btn btn-primary" onclick="saveSite()">保存全部网站设置</button>
      </div>
    </section>

    <!-- 概览 -->
    <section class="panel">
      <div class="section-head">
        <div class="section-title">
          <div class="section-icon">📊</div>
          <div>
            <h2>数据概览</h2>
            <p>仅显示当前游戏的启动统计</p>
          </div>
        </div>
      </div>

      <div class="stats">
        <div class="stat">
          <small>游戏数量</small>
          <strong id="statGames">0</strong>
        </div>
        <div class="stat">
          <small>全部启动次数</small>
          <strong id="statLaunches">0</strong>
        </div>
        <div class="stat">
          <small>今日启动次数</small>
          <strong id="statToday">0</strong>
        </div>
      </div>
    </section>

    <!-- 游戏管理 -->
    <section class="panel">
      <div class="section-head">
        <div class="section-title">
          <div class="section-icon">🎮</div>
          <div>
            <h2>游戏管理</h2>
            <p>上架、下架、图标、链接、排序与启动统计</p>
          </div>
        </div>
        <button class="btn btn-primary" onclick="addGame()">＋ 添加游戏</button>
      </div>

      <div id="games"></div>
    </section>

  </div>
</div>

<script>
let data={settings:{},games:[]};
let token=sessionStorage.getItem('gameNavToken')||'';

function headers(){
  return {
    'content-type':'application/json',
    'authorization':'Bearer '+token
  };
}

async function api(url,opt={}){
  return fetch(url,opt);
}

async function login(){
  const p=document.getElementById('pw').value.trim();
  if(!p){alert('请输入密码');return;}

  try{
    const r=await api('/api/login',{
      method:'POST',
      headers:{'content-type':'application/json'},
      body:JSON.stringify({password:p})
    });
    if(!r.ok){alert('密码错误');return;}
    token=p;
    sessionStorage.setItem('gameNavToken',token);
    await load();
  }catch(e){
    alert('登录失败，请检查网络');
  }
}

function logout(){
  sessionStorage.removeItem('gameNavToken');
  token='';
  location.reload();
}

async function load(){
  try{
    const r=await api('/api/site',{headers:headers()});
    if(!r.ok)throw new Error('load failed');

    data=await r.json();

    document.getElementById('loginPanel').classList.add('hidden');
    document.getElementById('admin').classList.remove('hidden');

    fill();
    renderGames();
    renderStats();
  }catch(e){
    sessionStorage.removeItem('gameNavToken');
    token='';
    document.getElementById('loginPanel').classList.remove('hidden');
    document.getElementById('admin').classList.add('hidden');
  }
}

function fill(){
  const s=data.settings||{};

  document.getElementById('siteName').value=s.site_name||'游戏导航';
  document.getElementById('accent').value=s.accent||'#3488ff';

  document.getElementById('bgUrl').value=s.background_url||'';
  document.getElementById('bgPreview').src=s.background_url||'';

  document.getElementById('contactUrl').value=s.contact_url||'';

  document.getElementById('announcementImageUrl').value=s.announcement_image_url||'';
  document.getElementById('announcementPreview').src=s.announcement_image_url||'';
  document.getElementById('announcementText').value=s.announcement_text||'';

  document.getElementById('telegramContact').value=s.telegram_contact||'';
  document.getElementById('telegramGroup').value=s.telegram_group||'';
  document.getElementById('telegramBot').value=s.telegram_bot||'';
  document.getElementById('email').value=s.email||'';
  document.getElementById('serviceTime').value=s.service_time||'';
}

function previewBg(){
  document.getElementById('bgPreview').src=
    document.getElementById('bgUrl').value.trim();
}

function previewAnnouncement(){
  document.getElementById('announcementPreview').src=
    document.getElementById('announcementImageUrl').value.trim();
}

async function saveSite(){
  const body={
    site_name:document.getElementById('siteName').value.trim(),
    accent:document.getElementById('accent').value,
    background_url:document.getElementById('bgUrl').value.trim(),
    logo_url:'',
    contact_url:document.getElementById('contactUrl').value.trim(),

    announcement_image_url:
      document.getElementById('announcementImageUrl').value.trim(),

    announcement_text:
      document.getElementById('announcementText').value.trim(),

    telegram_contact:
      document.getElementById('telegramContact').value.trim(),

    telegram_group:
      document.getElementById('telegramGroup').value.trim(),

    telegram_bot:
      document.getElementById('telegramBot').value.trim(),

    email:
      document.getElementById('email').value.trim(),

    service_time:
      document.getElementById('serviceTime').value.trim()
  };

  const r=await api('/api/site',{
    method:'PUT',
    headers:headers(),
    body:JSON.stringify(body)
  });

  if(!r.ok){
    const msg=await r.text().catch(()=> '');
    alert('保存失败'+(msg?'：'+msg:''));
    return;
  }

  await load();
  alert('保存成功');
}

function renderStats(){
  const games=data.games||[];
  const total=games.reduce((n,g)=>n+Number(g.total_launches||0),0);
  const today=games.reduce((n,g)=>n+Number(g.today_launches||0),0);

  document.getElementById('statGames').textContent=games.length;
  document.getElementById('statLaunches').textContent=total;
  document.getElementById('statToday').textContent=today;
}

function renderGames(){
  const box=document.getElementById('games');
  const games=data.games||[];

  if(!games.length){
    box.innerHTML='<div class="empty">🎮 暂无游戏，点击右上角“添加游戏”开始。</div>';
    return;
  }

  box.innerHTML=games.map(g=>{
    const enabled=Number(g.enabled)===1;
    const icon=g.icon_url||'';

    return `
      <div class="game">
        <div class="game-grid">

          <img class="game-icon"
               id="icon${g.id}"
               src="${esc(icon)}"
               onerror="this.style.visibility='hidden'">

          <div class="game-fields">
            <input id="n${g.id}" value="${esc(g.name)}" placeholder="游戏名称">
            <input id="d${g.id}" value="${esc(g.description)}" placeholder="游戏简介">
            <input id="i${g.id}" value="${esc(g.icon_url)}"
                   placeholder="图标直链" oninput="updateIcon(${g.id})">
          </div>

          <div class="game-fields">
            <input id="u${g.id}" value="${esc(g.game_url)}" placeholder="启动链接">

            <div style="display:flex;gap:8px">
              <input class="sort" id="s${g.id}" type="number"
                     value="${Number(g.sort_order||0)}" placeholder="排序">

              <select id="c${g.id}">
                <option value="全部" ${g.category==='全部'?'selected':''}>全部</option>
                <option value="游戏" ${g.category==='游戏'?'selected':''}>游戏</option>
              </select>
            </div>

            <div class="status">
              <input id="e${g.id}" type="checkbox" ${enabled?'checked':''}>
              <label for="e${g.id}">
                ${enabled?'🟢 已上架':'⚪ 已下架'}
              </label>
            </div>

            <div class="game-stats">
              <span class="game-stat">🚀 总启动 ${Number(g.total_launches||0)}</span>
              <span class="game-stat">📅 今日启动 ${Number(g.today_launches||0)}</span>
            </div>
          </div>

          <div class="game-actions">
            <button class="btn btn-primary" onclick="editGame(${g.id})">保存</button>

            <a class="btn btn-cyan"
               href="${esc(g.game_url||'#')}"
               target="_blank" rel="noopener">
              🔗 测试
            </a>

            <button class="btn btn-danger" onclick="delGame(${g.id})">删除</button>
          </div>

        </div>
      </div>
    `;
  }).join('');
}

function updateIcon(id){
  const url=document.getElementById('i'+id).value.trim();
  const img=document.getElementById('icon'+id);

  if(url){
    img.style.visibility='visible';
    img.src=url;
  }else{
    img.style.visibility='hidden';
  }
}

async function editGame(id){
  const enabled=document.getElementById('e'+id).checked;

  const body={
    name:document.getElementById('n'+id).value.trim(),
    description:document.getElementById('d'+id).value.trim(),
    icon_url:document.getElementById('i'+id).value.trim(),
    game_url:document.getElementById('u'+id).value.trim(),
    category:document.getElementById('c'+id).value,
    sort_order:Number(document.getElementById('s'+id).value||0),
    enabled:enabled
  };

  const r=await api('/api/games/'+id,{
    method:'PUT',
    headers:headers(),
    body:JSON.stringify(body)
  });

  if(!r.ok){alert('保存失败');return;}

  await load();
  alert(enabled?'保存成功，游戏已上架':'保存成功，游戏已下架');
}

async function addGame(){
  const r=await api('/api/games',{
    method:'POST',
    headers:headers(),
    body:JSON.stringify({
      name:'新游戏',
      description:'填写游戏简介',
      icon_url:'',
      game_url:'#',
      category:'全部',
      sort_order:(data.games||[]).length+1
    })
  });

  if(!r.ok){alert('添加失败');return;}
  await load();
}

async function delGame(id){
  if(!confirm('确定删除这个游戏？'))return;

  const r=await api('/api/games/'+id,{
    method:'DELETE',
    headers:headers()
  });

  if(!r.ok){alert('删除失败');return;}
  await load();
}

function esc(s){
  return String(s??'')
    .replaceAll('&','&amp;')
    .replaceAll('"','&quot;')
    .replaceAll('<','&lt;')
    .replaceAll('>','&gt;')
    .replaceAll("'",'&#39;');
}

if(token){
  load().catch(()=>{
    sessionStorage.removeItem('gameNavToken');
    token='';
  });
}
</script>
</body>
</html>
