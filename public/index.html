<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>Yukecil导航</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="color-scheme" content="dark">
<style>
:root{--bg:#07051a;--bg2:#120d33;--glass:rgba(255,255,255,.055);--glass2:rgba(255,255,255,.1);--line:rgba(255,255,255,.11);--ink:#f5f2ff;--sub:#a7a1d3;--p:#7a5cff;--p2:#b79bff;--gold:#f1d28a;--hot:#ff6a55;box-sizing:border-box}

body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:
radial-gradient(1.2px 1.2px at 12% 18%,#fff,transparent),radial-gradient(1px 1px at 78% 12%,#fff,transparent),radial-gradient(1.4px 1.4px at 90% 42%,#d9ccff,transparent),radial-gradient(1px 1px at 8% 55%,#fff,transparent),radial-gradient(1.2px 1.2px at 55% 70%,#d9ccff,transparent),radial-gradient(1px 1px at 30% 88%,#fff,transparent),radial-gradient(1.3px 1.3px at 85% 92%,#fff,transparent),
radial-gradient(560px 360px at 90% -60px,rgba(122,92,255,.5),transparent 70%),radial-gradient(460px 340px at -15% 40%,rgba(60,150,255,.2),transparent 70%),radial-gradient(500px 300px at 60% 105%,rgba(200,90,255,.18),transparent 70%),linear-gradient(180deg,var(--bg),var(--bg2))}
.top{padding:6px 2px 14px}

.search:focus-within{border-color:var(--p2);box-shadow:0 0 0 3px rgba(122,92,255,.25)}
.hero{position:relative;border-radius:28px;aspect-ratio:16/9;background:radial-gradient(circle at 78% 30%,#a78bff,transparent 40%),linear-gradient(135deg,#1b1257,#4a2fb5 60%,#23166b) center/cover no-repeat;display:grid;place-items:center;color:#e3d9ff;font-size:14px;border:1px solid rgba(255,255,255,.2);box-shadow:0 26px 60px -24px rgba(122,92,255,.9),inset 0 1px 0 rgba(255,255,255,.35);overflow:hidden}
.hero.has{color:transparent}
.notice{margin-top:14px;display:flex;align-items:center;gap:10px;background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:11px 14px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 10px var(--gold);flex:none}
.marq{white-space:nowrap;overflow:hidden;flex:1;font-size:13.5px}
.marq span{display:inline-block;padding-left:100%;animation:m 15s linear infinite}
@keyframes m{to{transform:translateX(-100%)}}
@media (prefers-reduced-motion:reduce){.marq span{animation:none;padding-left:0}.shine{animation:none;background:none;-webkit-text-fill-color:#c9b6ff;color:#c9b6ff}}
.strip{touch-action:pan-x pan-y;margin:16px -16px 0;padding:6px 16px 4px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.cat{flex:none;width:64px;text-align:center;background:none;border:0;color:var(--sub);font:600 12px inherit;font-family:inherit;cursor:pointer;padding:0}
.cat .ic{margin:0 auto 7px}
.cat.on{color:var(--gold)}.cat.on .ic{box-shadow:0 0 0 4px rgba(241,210,138,.18),0 8px 22px -4px rgba(122,92,255,.9)}
.ic{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;color:var(--gold);background:radial-gradient(circle at 30% 25%,#8b6bff,#3a2796 70%) padding-box,conic-gradient(from 200deg,#f6e3a8,#9a7a2e,#f6e3a8,#b8913d,#f6e3a8) border-box;border:2.5px solid transparent;box-shadow:0 8px 20px -6px rgba(122,92,255,.8),inset 0 2px 6px rgba(255,255,255,.35)}
.ic svg{width:54%;height:54%;filter:drop-shadow(0 2px 4px rgba(0,0,0,.4))}
.ic.sm{width:48px;height:48px}
.sec{display:flex;align-items:center;gap:10px;margin:26px 2px 14px}
.sec b{font-size:19px;letter-spacing:1px}.sec i{flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}.sec span{font-size:12px;color:var(--sub)}
.sec::before{content:"";width:4px;height:18px;border-radius:2px;background:linear-gradient(var(--gold),var(--p))}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.card{position:relative;text-align:center;padding:20px 8px 12px;border-radius:24px;background:linear-gradient(180deg,rgba(255,255,255,.1),rgba(255,255,255,.035));border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 16px 30px -18px #000}
.card::before{content:"";position:absolute;left:22%;right:22%;top:0;height:2px;background:linear-gradient(90deg,transparent,hsl(var(--h) 90% 75%),transparent)}
.tile{position:relative;width:60px;height:60px;margin:0 auto 11px;border-radius:19px;display:grid;place-items:center;color:#fff;background:linear-gradient(150deg,hsl(var(--h) 90% 68%),hsl(calc(var(--h) + 25) 75% 42%));box-shadow:0 12px 22px -8px hsl(var(--h) 90% 55%),inset 0 1px 0 rgba(255,255,255,.55),inset 0 -6px 10px rgba(0,0,0,.18)}
.tile::after{content:"";position:absolute;left:6px;right:6px;top:4px;height:42%;border-radius:15px 15px 40px 40px;background:linear-gradient(rgba(255,255,255,.4),rgba(255,255,255,0))}
.tile svg{position:relative;z-index:1;width:56%;height:56%;filter:drop-shadow(0 2px 3px rgba(0,0,0,.3))}
.hot{position:absolute;top:8px;right:8px;background:linear-gradient(135deg,#ff8a5c,var(--hot));color:#fff;font-size:10px;font-weight:700;border-radius:8px;padding:2px 6px}
.card h3{font-size:14px;font-weight:700}
.card p{font-size:11px;color:var(--sub);margin:3px 0 11px}
.go{display:block;background:linear-gradient(135deg,var(--p2),var(--p));color:#fff;text-decoration:none;font-size:13px;font-weight:600;border-radius:999px;padding:8px 0;box-shadow:0 8px 18px -8px var(--p),inset 0 1px 0 rgba(255,255,255,.35)}
.empty{grid-column:1/-1;text-align:center;color:var(--sub);padding:30px 0;font-size:14px}
.foot{text-align:center;color:var(--sub);font-size:11px;letter-spacing:2px;margin-top:30px;opacity:.7}
.cs .row{display:flex;align-items:center;gap:12px;background:linear-gradient(180deg,rgba(255,255,255,.1),rgba(255,255,255,.035));border:1px solid var(--line);border-radius:22px;padding:14px;margin-bottom:12px;box-shadow:inset 0 1px 0 rgba(255,255,255,.15)}
.info{flex:1;min-width:0}.info b{display:block;font-size:15px}.info span{font-size:13px;color:var(--sub);word-break:break-all}
.go.sm{display:inline-block;width:auto;padding:8px 16px;border:0;font-family:inherit;cursor:pointer}
.tip{text-align:center;font-size:12px;color:var(--sub);margin-top:14px}
.tabs{position:fixed;left:16px;right:16px;bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:528px;margin:0 auto;display:flex;padding:7px;border-radius:28px;background:rgba(22,16,58,.78);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 18px 40px -10px #000}
.tabs a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;border-radius:21px;font-size:12px;color:var(--sub);text-decoration:none;font-weight:600}
.tabs a.on{color:var(--gold);background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.05))}
.tabs a span{display:grid;place-items:center;height:28px}.ti{width:26px;height:26px}

.strip{margin:16px -16px 0;padding:6px 0 4px;overflow:hidden;touch-action:auto;pointer-events:none;-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.track{display:flex;width:max-content;animation:slide 26s linear infinite}
.cat{flex:none;width:64px;margin-right:12px;text-align:center;color:var(--sub);font-size:12px;font-weight:600}
@keyframes slide{from{transform:translateX(-50%)}to{transform:translateX(0)}}
@media (prefers-reduced-motion:reduce){.track{animation:none}}
body{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.tabs{left:50%;right:auto;width:auto;max-width:none;transform:translateX(-50%);padding:5px;gap:4px;border-radius:22px}
.tabs a{flex:none;min-width:88px;padding:6px 12px;border-radius:17px;font-size:11px;gap:1px}
.tabs a span{height:24px}.ti{width:22px;height:22px}


/* ===== Yukecil 手机端最终修正版 ===== */
.search{display:none!important}

.strip{
  margin:16px -16px 0;
  padding:6px 16px 8px;
  display:flex;
  gap:8px;
  overflow-x:auto;
  scrollbar-width:none;
  animation:none;
  width:auto;
}
.strip::-webkit-scrollbar{display:none}
.strip .cat{
  flex:0 0 auto;
  width:68px;
  border:0;
  outline:0;
  color:var(--sub);
  background:transparent;
  text-align:center;
  font:600 12px inherit;
  font-family:inherit;
  cursor:pointer;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}
.strip .cat .ic{margin:0 auto 7px}
.strip .cat.on{color:var(--gold)}
.strip .cat.on .ic{
  box-shadow:0 0 0 4px rgba(241,210,138,.18),0 8px 22px -4px rgba(122,92,255,.9)
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:10px;
}
.card{
  position:relative;
  min-width:0;
  display:block;
  text-align:center;
  padding:18px 8px 12px;
  border-radius:22px;
  background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.035));
  border:1px solid var(--line);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 16px 30px -18px #000;
  color:var(--ink);
  text-decoration:none;
  transition:transform .18s ease,border-color .18s ease;
  -webkit-tap-highlight-color:transparent;
}
.card:active{transform:scale(.97)}
.card:hover{border-color:rgba(183,155,255,.45)}
.tile{
  position:relative;
  width:56px;height:56px;
  margin:0 auto 10px;
  border-radius:17px;
  display:grid;place-items:center;
  color:#fff;
  background:linear-gradient(150deg,#9678ff,#4b35ad);
  box-shadow:0 12px 22px -8px rgba(122,92,255,.85),inset 0 1px 0 rgba(255,255,255,.55),inset 0 -6px 10px rgba(0,0,0,.18);
}
.tile svg{width:31px;height:31px}
.card h3{
  min-height:20px;
  color:#fff;
  font-size:14px;
  line-height:20px;
  font-weight:700;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.card p{
  height:32px;
  margin-top:3px;
  color:var(--sub);
  font-size:10px;
  line-height:16px;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}
.card .go{
  margin-top:8px;
  display:block;
  background:linear-gradient(135deg,var(--p2),var(--p));
  color:#fff;
  text-decoration:none;
  font-size:11px;
  font-weight:600;
  border-radius:999px;
  padding:7px 0;
  box-shadow:0 8px 18px -8px var(--p),inset 0 1px 0 rgba(255,255,255,.35);
}
.hot{
  position:absolute;
  right:7px;
  top:7px;
  padding:2px 5px;
  border-radius:6px;
  font-size:8px;
  color:#ffe3a0;
  background:rgba(255,190,80,.13);
  border:1px solid rgba(255,220,130,.15);
}
#contact{display:none;padding-bottom:100px}
body:has(#contact:target) #home{display:none}
body:has(#contact:target) #contact{display:block}
body:has(#contact:target) #t-home{color:var(--sub);background:transparent}
body:has(#contact:target) #t-cs{color:#fff;background:rgba(255,255,255,.08)}
body:not(:has(#contact:target)) #t-home{color:#fff;background:rgba(255,255,255,.08)}
@media(max-width:390px){
  .grid{gap:8px}
  .card{padding-left:6px;padding-right:6px}
  .tile{width:52px;height:52px}
  .tile svg{width:29px;height:29px}
  .card h3{font-size:13px}
  .card p{font-size:9.5px}
}


/* ===== 动效恢复 ===== */
.hero{
  animation:heroFloat 7s ease-in-out infinite alternate;
  will-change:transform,filter;
}
@keyframes heroFloat{
  0%{transform:translateY(0);filter:brightness(1)}
  100%{transform:translateY(-3px);filter:brightness(1.06)}
}
.strip .cat{
  animation:catFloat 3.6s ease-in-out infinite;
  will-change:transform;
}
.strip .cat:nth-child(2){animation-delay:.25s}
.strip .cat:nth-child(3){animation-delay:.5s}
.strip .cat:nth-child(4){animation-delay:.75s}
.strip .cat:nth-child(5){animation-delay:1s}
.strip .cat:nth-child(6){animation-delay:1.25s}
.strip .cat:nth-child(7){animation-delay:1.5s}
.strip .cat:nth-child(8){animation-delay:1.75s}
.strip .cat:nth-child(9){animation-delay:2s}
@keyframes catFloat{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-5px)}
}
.tile{
  animation:tileGlow 3.2s ease-in-out infinite alternate;
}
.card:nth-child(2n) .tile{animation-delay:.7s}
.card:nth-child(3n) .tile{animation-delay:1.3s}
@keyframes tileGlow{
  from{box-shadow:0 12px 22px -8px rgba(122,92,255,.72),inset 0 1px 0 rgba(255,255,255,.55),inset 0 -6px 10px rgba(0,0,0,.18)}
  to{box-shadow:0 14px 28px -6px rgba(160,110,255,.95),inset 0 1px 0 rgba(255,255,255,.65),inset 0 -6px 10px rgba(0,0,0,.18)}
}
.card{
  animation:cardIn .55s ease both;
}
.card:nth-child(2){animation-delay:.03s}.card:nth-child(3){animation-delay:.06s}
.card:nth-child(4){animation-delay:.09s}.card:nth-child(5){animation-delay:.12s}
.card:nth-child(6){animation-delay:.15s}.card:nth-child(7){animation-delay:.18s}
.card:nth-child(8){animation-delay:.21s}.card:nth-child(9){animation-delay:.24s}
@keyframes cardIn{
  from{opacity:0;transform:translateY(10px)}
  to{opacity:1;transform:translateY(0)}
}
@media (prefers-reduced-motion:reduce){
  .hero,.strip .cat,.tile,.card{animation:none!important}
}


/* ===== 分类图标：从左到右无限循环 ===== */
.strip{
  position:relative;
  margin:16px -16px 0;
  padding:6px 0 10px;
  overflow:hidden;
  width:calc(100% + 32px);
  -webkit-mask-image:linear-gradient(to right,transparent 0,#000 5%,#000 95%,transparent 100%);
  mask-image:linear-gradient(to right,transparent 0,#000 5%,#000 95%,transparent 100%);
}
.cat-track{
  display:flex;
  width:max-content;
  animation:catLoop 18s linear infinite;
  will-change:transform;
}
.cat-set{
  display:flex;
  gap:8px;
  padding:0 4px;
  flex-shrink:0;
}
.strip .cat{
  flex:0 0 68px;
  width:68px;
  border:0;
  outline:0;
  color:var(--sub);
  background:transparent;
  text-align:center;
  font:600 12px inherit;
  font-family:inherit;
  cursor:pointer;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}
.strip .cat .ic{margin:0 auto 7px}
.strip .cat.on{color:var(--gold)}
.strip .cat.on .ic{
  box-shadow:0 0 0 4px rgba(241,210,138,.18),0 8px 22px -4px rgba(122,92,255,.9)
}
.cat-track:hover{animation-play-state:paused}
@keyframes catLoop{
  from{transform:translateX(0)}
  to{transform:translateX(calc(-50% - 4px))}
}
@media(max-width:390px){
  .strip .cat{flex-basis:64px;width:64px}
  .cat-set{gap:6px}
}
.dynamic-game .tile img{width:100%;height:100%;object-fit:cover;border-radius:inherit;position:relative;z-index:2}.dynamic-game .tile.has-img{background:#20134f}.dynamic-game .tile.has-img::after{display:none}

/* ===== 后台上架游戏同步到顶部循环（不复制游戏数据） ===== */
.game-loop .cat-track{
  display:flex;
  width:max-content;
  gap:10px;
  transform:translate3d(0,0,0);
  will-change:transform;
}
.game-loop .cat-set{
  display:flex;
  gap:10px;
  padding:0 5px;
  flex-shrink:0;
}
.game-loop .game-loop-item{
  flex:0 0 68px;
  width:68px;
  border:0;
  outline:0;
  background:transparent;
  color:var(--sub);
  text-align:center;
  font:600 11px inherit;
  font-family:inherit;
  padding:0;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
.game-loop .game-loop-icon{
  width:56px;
  height:56px;
  margin:0 auto 6px;
  border-radius:50%;
  display:grid;
  place-items:center;
  overflow:hidden;
  color:var(--gold);
  background:radial-gradient(circle at 30% 25%,#8b6bff,#3a2796 70%) padding-box,conic-gradient(from 200deg,#f6e3a8,#9a7a2e,#f6e3a8,#b8913d,#f6e3a8) border-box;
  border:2.5px solid transparent;
  box-shadow:0 8px 20px -6px rgba(122,92,255,.8),inset 0 2px 6px rgba(255,255,255,.35);
  transition:transform .18s ease;
}
.game-loop .game-loop-icon img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
.game-loop .game-loop-icon svg{width:52%;height:52%}
.game-loop .game-loop-item:active .game-loop-icon{transform:scale(.92)}
.game-loop .game-loop-item span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:390px){
  .game-loop .game-loop-item{flex-basis:62px;width:62px}
  .game-loop .cat-set{gap:7px}
  .game-loop .game-loop-icon{width:52px;height:52px}
}

    grid.innerHTML=games.length?games.map(g=>{
      const icon=g.icon_url?`<img src="${esc(g.icon_url)}" alt="">`:`<svg><use href="#${iconFor(g.category)}"></use></svg>`;
      return `<div class="card dynamic-game" id="game-${g.id}" data-cat="${esc(g.category||'工具')}"><div class="tile ${g.icon_url?'has-img':''}" style="--h:${((g.id*47)%360)}">${icon}</div><h3>${esc(g.name)}</h3><p>${esc(g.description||'')}</p><a class="go" href="${esc(g.game_url||'#')}" target="_blank" rel="noopener noreferrer" data-launch="${g.id}">点击进入</a></div>`;
    }).join(''):'<div class="empty">暂无上架内容</div>';
    grid.querySelectorAll('[data-launch]').forEach(a=>a.addEventListener('click',()=>{
      fetch(`/api/games/${a.dataset.launch}/launch`,{method:'POST',keepalive:true}).catch(()=>{});
    }));
  }
  let loopTimer=null;
  let loopBusy=false;
  const loopSpeed=55;
  let loopOffset=0;

  function stopGameLoop(){
    if(loopTimer){cancelAnimationFrame(loopTimer);loopTimer=null;}
  }

  function startGameLoop(){
    stopGameLoop();
    const items=[...track.querySelectorAll('.game-loop-item')];
    if(items.length<2) return;

    let last=performance.now();
    const tick=(now)=>{
      const dt=Math.min(40,now-last);
      last=now;
      if(!loopBusy){
        loopOffset-=loopSpeed*dt/1000;
        const first=track.querySelector('.game-loop-item');
        if(first){
          const gap=10;
          const step=first.getBoundingClientRect().width+gap;
          if(-loopOffset>=step){
            loopOffset+=step;
            track.appendChild(first);
          }
        }
        track.style.transform=`translate3d(${loopOffset}px,0,0)`;
      }
      loopTimer=requestAnimationFrame(tick);
    };
    loopTimer=requestAnimationFrame(tick);
  }

  function renderGameLoop(){
    stopGameLoop();
    loopOffset=0;
    track.innerHTML='';
    if(!games.length) return;

    const set=document.createElement('div');
    set.className='cat-set';
    games.forEach(g=>{
      const btn=document.createElement('button');
      btn.className='game-loop-item';
      btn.type='button';
      btn.dataset.gameId=g.id;
      btn.title=g.name||'';

      const iconWrap=document.createElement('div');
      iconWrap.className='game-loop-icon';
      if(g.icon_url){
        const img=document.createElement('img');
        img.src=g.icon_url;
        img.alt=g.name||'';
        img.loading='lazy';
        iconWrap.appendChild(img);
      }else{
        iconWrap.innerHTML=`<svg><use href="#${iconFor(g.category)}"></use></svg>`;
      }

      const label=document.createElement('span');
      label.textContent=g.name||'';
      btn.append(iconWrap,label);

      btn.addEventListener('click',()=>{
        const card=document.getElementById('game-'+btn.dataset.gameId);
        if(card){
          card.scrollIntoView({behavior:'smooth',block:'center'});
          card.animate(
            [{transform:'scale(1)'},{transform:'scale(1.035)'},{transform:'scale(1)'}],
            {duration:450}
          );
        }
      });
      set.appendChild(btn);
    });

    track.appendChild(set);
    track.style.transform='translate3d(0,0,0)';
    startGameLoop();
  }

  function renderNotice(){
    const text=settings.announcement_text || 'Yukecil导航 · 精选设计、开发、AI、素材、学习与效率工具';
    noticeContent.innerHTML='<span>'+esc(text)+'</span>';
    noticeBox.style.padding='11px 14px';
    noticeBox.querySelector('.dot').style.display='block';
  }
  function renderServiceTime(){
    if(serviceTime) serviceTime.textContent=settings.service_time || '每天 10:00 - 22:00';
  }
  function renderSiteSettings(){
    if(siteName && settings.site_name) siteName.textContent=settings.site_name;
    if(settings.background_url) document.body.style.backgroundImage=`url("${String(settings.background_url).replace(/"/g,'\\"')}")`;
    if(contactLink && settings.contact_url) contactLink.href=settings.contact_url;
  }
  function renderHero(){
    if(settings.announcement_image_url){
      hero.style.backgroundImage=`url("${String(settings.announcement_image_url).replace(/"/g,'\\"')}")`;
      hero.classList.add('has');
    }
  }
  async function load(){
    try{
      const r=await fetch(API);
      if(!r.ok)throw 0;
      const d=await r.json();
      games=(d.games||[]).filter(g=>g.enabled===undefined||g.enabled);
      settings=d.settings||{};
      renderGameLoop();
      renderGames();
      renderNotice();
      renderServiceTime();
      renderHero();
      renderSiteSettings();
    }catch(e){
      renderGameLoop();
      renderGames();
    }
  }
  const pause=()=>{loopBusy=true};
  const resume=()=>{loopBusy=false};
  ['touchstart','pointerdown'].forEach(ev=>loopStrip.addEventListener(ev,pause,{passive:true}));
  ['touchend','pointerup','pointercancel','touchcancel'].forEach(ev=>loopStrip.addEventListener(ev,resume,{passive:true}));
  loopStrip.addEventListener('mouseenter',pause);
  loopStrip.addEventListener('mouseleave',resume);
  load();
})();
</script>
</body></html>
