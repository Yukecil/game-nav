<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>Yukecil导航</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="color-scheme" content="light">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff3f8;--bg2:#e9f6ff;--ol:#5b3a6e;--ink:#4a3358;--sub:#8d7a9e;--pink:#ff7eb6;--pink2:#ffc2dc;--sky:#7fd1ff;--lav:#c1b0ff;--yel:#ffe27a;--card:#fff;--font:"ZCOOL KuaiLe","PingFang SC","Microsoft YaHei",sans-serif;box-sizing:border-box}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
html,body{overscroll-behavior-y:none}
body{color:var(--ink);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;max-width:560px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top,0px)) 16px calc(104px + env(safe-area-inset-bottom,0px));position:relative;background-color:var(--bg);background-size:cover;background-attachment:fixed}
/* 背景：粉蓝渐变 + 半调圆点 */
body::before{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;background:radial-gradient(rgba(255,126,182,.22) 1.6px,transparent 2px) 0 0/18px 18px,linear-gradient(170deg,var(--bg) 0%,#f3eeff 55%,var(--bg2) 100%)}
/* 飘落樱花 */
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:
radial-gradient(ellipse 5px 8px at 20px 20px,#ffb3d1 60%,transparent 62%),
radial-gradient(ellipse 4px 7px at 110px 90px,#ffc9df 60%,transparent 62%),
radial-gradient(ellipse 5px 8px at 190px 40px,#ffa6c9 60%,transparent 62%),
radial-gradient(ellipse 4px 6px at 70px 150px,#ffd3e5 60%,transparent 62%);
background-size:230px 190px;animation:fall 14s linear infinite;opacity:.85}
@keyframes fall{to{background-position:-60px 190px}}
.top{padding:6px 2px 14px;text-align:center}
.logo{font-family:var(--font);font-size:34px;letter-spacing:3px;line-height:1.1}
.logo small{display:block;font-family:var(--font);font-size:12px;color:var(--sub);letter-spacing:3px;margin-top:6px;-webkit-text-fill-color:var(--sub)}
.shine{background:linear-gradient(110deg,var(--pink) 35%,#fff 50%,var(--pink) 65%) 200% 0/250% 100% no-repeat,linear-gradient(90deg,var(--pink),var(--lav),var(--sky));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;filter:drop-shadow(2px 2px 0 var(--ol));animation:sh 3s ease-in-out infinite}
@keyframes sh{0%{background-position:200% 0,0 0}60%,100%{background-position:-100% 0,0 0}}
.search{display:none!important}
/* 横幅：动漫天空 */
.hero{position:relative;border-radius:26px;aspect-ratio:16/9;border:3px solid var(--ol);box-shadow:5px 5px 0 var(--ol);overflow:hidden;display:grid;place-items:center;
background:radial-gradient(ellipse 60px 26px at 22% 72%,#fff 70%,transparent 72%),radial-gradient(ellipse 80px 30px at 30% 78%,#fff 70%,transparent 72%),radial-gradient(ellipse 70px 26px at 78% 62%,#fff 70%,transparent 72%),radial-gradient(circle at 80% 24%,#fff6b8 0 22px,rgba(255,246,184,.4) 23px 40px,transparent 41px),linear-gradient(180deg,#8fd6ff 0%,#c9c2ff 55%,#ffc2dc 100%) center/cover no-repeat}
.hero::before{content:"✿ 欢迎来到次元入口 ✿";font-family:var(--font);font-size:20px;letter-spacing:3px;color:#fff;text-shadow:2px 2px 0 var(--ol),-1px -1px 0 var(--ol),1px -1px 0 var(--ol),-1px 1px 0 var(--ol)}
.hero::after{content:"✦ ✧ ✦";position:absolute;top:10px;left:14px;color:#fff;font-size:18px;letter-spacing:10px;text-shadow:0 0 6px #fff;animation:tw 2.4s ease-in-out infinite}
@keyframes tw{50%{opacity:.35}}
.hero.has::before,.hero.has::after{display:none}
.notice{margin-top:16px;position:relative;overflow:hidden;display:flex;align-items:center;gap:10px;background:#fff;border:3px solid var(--ol);border-radius:18px;padding:10px 14px;box-shadow:4px 4px 0 var(--pink)}
.dot{width:20px;height:20px;flex:none;background:var(--yel);border:2px solid var(--ol);clip-path:none;border-radius:50% 0 50% 50%;transform:rotate(45deg);animation:nt 2.2s ease-in-out infinite}
@keyframes nt{50%{transform:rotate(135deg) scale(1.15)}}
.marq{white-space:nowrap;overflow:hidden;flex:1;font-family:var(--font);font-size:18px;letter-spacing:2px;line-height:1.4}
.marq span{display:inline-block;padding-left:100%;animation:m 15s linear infinite;color:var(--pink)}
@keyframes m{to{transform:translateX(-100%)}}
/* 顶部循环图标（保持原 JS 结构） */
.strip{position:relative;margin:18px -16px 0;padding:6px 0 10px;overflow:hidden;width:calc(100% + 32px);touch-action:pan-y;-webkit-mask-image:linear-gradient(to right,transparent 0,#000 6%,#000 94%,transparent 100%);mask-image:linear-gradient(to right,transparent 0,#000 6%,#000 94%,transparent 100%)}
.cat-track{display:flex;width:max-content;gap:10px;transform:translate3d(0,0,0);will-change:transform}
.cat-set{display:flex;gap:10px;padding:0 5px;flex-shrink:0}
.game-loop-item{flex:0 0 68px;width:68px;border:0;outline:0;background:transparent;color:var(--ink);text-align:center;font:600 11px var(--font);padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.game-loop-icon{width:56px;height:56px;margin:0 auto 6px;border-radius:50%;display:grid;place-items:center;overflow:hidden;color:#fff;background:linear-gradient(150deg,var(--pink2),var(--lav));border:3px solid var(--ol);box-shadow:3px 3px 0 var(--ol);transition:transform .15s}
.game-loop-icon img{width:100%;height:100%;object-fit:cover;display:block}
.game-loop-icon svg{width:52%;height:52%}
.game-loop-item:active .game-loop-icon{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ol)}
.game-loop-item span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec{display:flex;align-items:center;gap:10px;margin:24px 2px 16px}
.sec b{font-family:var(--font);font-size:21px;letter-spacing:2px;background:var(--yel);border:3px solid var(--ol);border-radius:14px;padding:2px 14px;box-shadow:3px 3px 0 var(--ol);transform:rotate(-2deg)}
.sec i{flex:1;height:0;border-top:3px dotted var(--pink)}
.sec span{font-size:12px;font-weight:700;color:#fff;background:var(--sky);border:2px solid var(--ol);border-radius:999px;padding:2px 10px}
/* 卡片：漫画贴纸风 */
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 10px}
.card{position:relative;min-width:0;display:block;text-align:center;padding:16px 7px 12px;border-radius:22px;background:var(--card);border:3px solid var(--ol);box-shadow:4px 4px 0 var(--ol);color:var(--ink);animation:cardIn .5s ease both;transition:transform .15s,box-shadow .15s}
.card:nth-child(odd){transform:rotate(-1deg)}.card:nth-child(even){transform:rotate(1deg)}
.card:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ol)}
.card::before{content:"";position:absolute;left:0;right:0;top:0;height:30px;border-radius:19px 19px 0 0;background:radial-gradient(hsl(var(--h) 90% 82%) 1.4px,transparent 1.8px) 0 0/8px 8px,hsl(var(--h) 90% 93%);z-index:0}
.card:nth-child(2){animation-delay:.04s}.card:nth-child(3){animation-delay:.08s}.card:nth-child(4){animation-delay:.12s}.card:nth-child(5){animation-delay:.16s}.card:nth-child(6){animation-delay:.2s}
@keyframes cardIn{from{opacity:0;translate:0 12px}to{opacity:1;translate:0 0}}
.tile{position:relative;z-index:1;width:56px;height:56px;margin:0 auto 10px;border-radius:50%;display:grid;place-items:center;color:#fff;background:linear-gradient(150deg,hsl(var(--h) 95% 74%),hsl(calc(var(--h) + 30) 85% 62%));border:3px solid var(--ol);box-shadow:2px 3px 0 var(--ol)}
.tile::after{content:"";position:absolute;left:10px;top:7px;width:14px;height:8px;border-radius:50%;background:rgba(255,255,255,.75);transform:rotate(-30deg)}
.tile svg{position:relative;z-index:1;width:30px;height:30px}
.dynamic-game .tile img{width:100%;height:100%;object-fit:cover;border-radius:50%;position:relative;z-index:2}
.dynamic-game .tile.has-img{background:#fff}.dynamic-game .tile.has-img::after{display:none}
.card h3{position:relative;font-family:var(--font);min-height:22px;font-size:15px;line-height:22px;font-weight:400;letter-spacing:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dynamic-game p{position:relative;min-height:44px;max-height:66px;margin:8px 0 10px;padding:7px 7px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere;color:var(--ink);font-size:12px;line-height:1.5;text-align:left;background:#fff8fc;border:2px dashed var(--pink);border-radius:12px}
.go{display:block;background:var(--pink);color:#fff;text-decoration:none;font-family:var(--font);font-size:13px;letter-spacing:1px;border:2.5px solid var(--ol);border-radius:999px;padding:6px 0;box-shadow:0 3px 0 var(--ol);text-shadow:1px 1px 0 var(--ol);-webkit-tap-highlight-color:transparent}
.go:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ol)}
.empty{grid-column:1/-1;text-align:center;color:var(--sub);padding:30px 0;font-size:14px}
.foot{text-align:center;color:var(--sub);font-family:var(--font);font-size:12px;letter-spacing:3px;margin-top:30px}
.foot::before{content:"✿ ";color:var(--pink)}.foot::after{content:" ✿";color:var(--pink)}
/* 客服页 */
.cs .row{display:flex;align-items:center;gap:12px;background:#fff;border:3px solid var(--ol);border-radius:22px;padding:12px 14px;margin-bottom:14px;box-shadow:4px 4px 0 var(--lav)}
.cs .row:nth-child(even){box-shadow:4px 4px 0 var(--sky)}
.ic{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;color:#fff;background:linear-gradient(150deg,var(--pink2),var(--pink));border:3px solid var(--ol);box-shadow:2px 3px 0 var(--ol)}
.ic svg{width:54%;height:54%}.ic.sm{width:48px;height:48px;flex:none}
.info{flex:1;min-width:0}.info b{display:block;font-family:var(--font);font-weight:400;font-size:16px;letter-spacing:1px}.info span{font-size:13px;color:var(--sub);word-break:break-all}
.go.sm{display:inline-block;width:auto;padding:6px 16px;font-family:var(--font);cursor:pointer}
.tip{text-align:center;font-size:12px;color:var(--sub);margin-top:14px}
/* 客服悬浮按钮 */
.cs-fab{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:50%;display:grid;place-items:center;color:#fff;background:linear-gradient(150deg,var(--pink2),var(--pink));border:3px solid var(--ol);box-shadow:3px 4px 0 var(--ol);cursor:pointer;z-index:10;padding:0;-webkit-tap-highlight-color:transparent;animation:fabBob 3s ease-in-out infinite}
.cs-fab svg{width:30px;height:30px}
.cs-fab::after{content:"";position:absolute;left:11px;top:8px;width:14px;height:8px;border-radius:50%;background:rgba(255,255,255,.7);transform:rotate(-30deg)}
.cs-fab:active{transform:translate(2px,3px);box-shadow:1px 1px 0 var(--ol);animation:none}
@keyframes fabBob{50%{transform:translateY(-5px)}}
/* 客服弹窗 */
.cs-modal{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:rgba(91,58,110,.45);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);opacity:0;visibility:hidden;transition:opacity .2s,visibility .2s}
.cs-modal.open{opacity:1;visibility:visible}
.cs-sheet{width:100%;max-width:560px;max-height:85vh;overflow-y:auto;background:var(--bg);border:3px solid var(--ol);border-bottom:0;border-radius:28px 28px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));transform:translateY(40px);transition:transform .25s ease}
.cs-modal.open .cs-sheet{transform:none}
.cs-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.cs-head .logo{font-size:26px;text-align:left}
.cs-head small{font-family:var(--font);font-size:12px;color:var(--sub);letter-spacing:2px;display:block;margin-top:4px}
.cs-close{width:38px;height:38px;border-radius:50%;border:2.5px solid var(--ol);background:#fff;color:var(--ol);font-size:18px;font-weight:700;box-shadow:2px 2px 0 var(--ol);cursor:pointer;flex:none}
.cs-close:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--ol)}
@media(max-width:390px){.grid{gap:12px 8px}.card{padding-left:5px;padding-right:5px}.tile{width:52px;height:52px}.card h3{font-size:14px}.dynamic-game p{font-size:11.5px}.game-loop-item{flex-basis:62px;width:62px}.game-loop-icon{width:52px;height:52px}}
@media (prefers-reduced-motion:reduce){body::after,.cs-fab,.shine,.hero::after,.dot,.marq span,.card{animation:none!important}.marq span{padding-left:0}.shine{background:none;-webkit-text-fill-color:var(--pink);color:var(--pink)}}
</style></head><body>

<script>
(() => {
  const API='/api/site';
  let games=[];
  let settings={};
  const grid=document.getElementById('g');
  const count=document.getElementById('n');
  const track=document.getElementById('catTrack');
  const loopStrip=document.getElementById('gameLoopStrip');
  const noticeContent=document.getElementById('noticeContent');
  const noticeBox=document.getElementById('noticeBox');
  const hero=document.getElementById('hero');
  const serviceTime=document.getElementById('serviceTime');
  const siteName=document.getElementById('siteName');
  const contactLink=document.getElementById('contactLink');
  const groupLink=document.getElementById('groupLink');
  const botLink=document.getElementById('botLink');
  const emailLink=document.getElementById('emailLink');
  const tg=document.getElementById('tg');
  const tgGroup=document.getElementById('tgGroup');
  const tgBot=document.getElementById('tgBot');
  const em=document.getElementById('em');

  function esc(v=''){return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
  function iconFor(cat){return ({AI:'i-globe',设计:'i-palette',开发:'i-laptop',素材:'i-camera',学习:'i-book',效率:'i-note',数据:'i-chart',娱乐:'i-phones',工具:'i-tools'})[cat]||'i-globe'}
  function renderGames(){
    count.textContent=games.length+' 个';
    grid.innerHTML=games.length?games.map(g=>{
      const icon=g.icon_url?`<img src="${esc(g.icon_url)}" alt="">`:`<svg><use href="#${iconFor(g.category)}"></use></svg>`;
      return `<div class="card dynamic-game" id="game-${g.id}" data-cat="${esc(g.category||'工具')}"><div class="tile ${g.icon_url?'has-img':''}" style="--h:${((g.id*47)%360)}">${icon}</div><h3>${esc(g.name)}</h3><p>${esc(g.description||'')}</p><a class="go" href="${esc(g.game_url||'#')}" target="_blank" rel="noopener noreferrer" data-launch="${g.id}">点击进入</a></div>`;
    }).join(''):'<div class="empty">暂无上架内容</div>';
    grid.querySelectorAll('[data-launch]').forEach(a=>a.addEventListener('click',()=>{
      fetch(`/api/games/${a.dataset.launch}/launch`,{method:'POST',keepalive:true}).catch(()=>{});
    }));
  }
  let loopTimer=null;
  let loopBusy=false;
  let loopOffset=0;
  let loopStep=0;
  const loopSpeed=40; // 像素/秒，方向：从左到右

  function stopGameLoop(){
    if(loopTimer){cancelAnimationFrame(loopTimer);loopTimer=null;}
  }

  function startGameLoop(){
    stopGameLoop();
    if(!loopStep) return;
    let last=performance.now();
    const tick=(now)=>{
      const dt=Math.min(40,now-last);
      last=now;
      if(!loopBusy){
        loopOffset+=loopSpeed*dt/1000;
        if(loopOffset>=0) loopOffset-=loopStep;
        track.style.transform=`translate3d(${loopOffset}px,0,0)`;
      }
      loopTimer=requestAnimationFrame(tick);
    };
    loopTimer=requestAnimationFrame(tick);
  }

  function makeLoopSet(isClone){
    const set=document.createElement('div');
    set.className='cat-set';
    if(isClone) set.setAttribute('aria-hidden','true');
    games.forEach(g=>{
      const btn=document.createElement('button');
      btn.className='game-loop-item';
      btn.type='button';
      btn.dataset.gameId=g.id;
      btn.title=g.name||'';
      if(isClone) btn.tabIndex=-1;
      const iconWrap=document.createElement('div');
      iconWrap.className='game-loop-icon';
      if(g.icon_url){
        const img=document.createElement('img');
        img.src=g.icon_url;
        img.alt=g.name||'';
        iconWrap.appendChild(img);
      }else{
        iconWrap.innerHTML=`<svg><use href="#${iconFor(g.category)}"></use></svg>`;
      }
      const label=document.createElement('span');
      label.textContent=g.name||'';
      btn.append(iconWrap,label);
      set.appendChild(btn);
    });
    return set;
  }

  function renderGameLoop(){
    stopGameLoop();
    loopOffset=0;
    loopStep=0;
    track.innerHTML='';
    track.style.transform='translate3d(0,0,0)';
    if(!games.length) return;

    const first=makeLoopSet(false);
    track.appendChild(first);
    const setW=first.getBoundingClientRect().width;
    if(!setW){ setTimeout(renderGameLoop,300); return; }

    loopStep=setW+10; // 10 = .cat-track 的 gap
    const viewW=loopStrip.clientWidth||window.innerWidth;
    const copies=Math.ceil(viewW/loopStep)+1;
    for(let i=0;i<copies;i++) track.appendChild(makeLoopSet(true));

    loopOffset=-loopStep;
    track.style.transform=`translate3d(${loopOffset}px,0,0)`;
    startGameLoop();
  }

  track.addEventListener('click',e=>{
    const btn=e.target.closest('.game-loop-item');
    if(!btn) return;
    const card=document.getElementById('game-'+btn.dataset.gameId);
    if(card){
      card.scrollIntoView({behavior:'smooth',block:'center'});
      card.animate([{scale:'1'},{scale:'1.06'},{scale:'1'}],{duration:450});
    }
  });
  let loopResizeTimer=null;
  window.addEventListener('resize',()=>{clearTimeout(loopResizeTimer);loopResizeTimer=setTimeout(renderGameLoop,200)});

  function renderNotice(){
    const text=settings.announcement_text || 'Yukecil导航 · 精选设计、开发、AI、素材、学习与效率工具';
    noticeContent.innerHTML='<span>'+esc(text)+'</span>';
  }
  function renderServiceTime(){
    if(serviceTime) serviceTime.textContent=settings.service_time || '每天 10:00 - 22:00';
  }
  function tgId(v){
    let x=String(v||'').trim();
    if(!x) return '';
    x=x.replace(/^tg:\/\/resolve\?domain=/i,'').replace(/^(https?:\/\/)?(www\.)?(t\.me|telegram\.me|telegram\.dog)\//i,'').replace(/^@/,'');
    x=x.split(/[?#]/)[0].replace(/\/+$/,'');
    if(/^(\+|joinchat\/)/i.test(x)) return x;
    return x.split('/')[0];
  }
  function tgUrl(v){
    const x=String(v||'').trim();
    if(!x) return '#';
    if(/^https?:\/\//i.test(x) && !/(^|\/\/)(www\.)?(t\.me|telegram\.(me|dog))\//i.test(x)) return x;
    const id=tgId(x);
    return id?'https://t.me/'+id:'#';
  }
  function tgLabel(v){
    const id=tgId(v);
    if(!id) return '';
    if(!/^https:\/\/t\.me\//.test(tgUrl(v))) return '外部链接';
    return /^(\+|joinchat\/)/i.test(id)?'邀请链接':'@'+id;
  }
  function renderSiteSettings(){
    if(siteName && settings.site_name) siteName.textContent=settings.site_name;
    if(settings.background_url){
      document.body.style.backgroundImage=`url("${String(settings.background_url).replace(/"/g,'%22')}")`;
    }
    const personal=settings.telegram_contact || '';
    const group=settings.telegram_group || '';
    const bot=settings.telegram_bot || '';
    const mail=settings.email || '';
    if(tg) tg.textContent=tgLabel(personal||settings.contact_url) || '未设置';
    if(tgGroup) tgGroup.textContent=tgLabel(group) || '未设置';
    if(tgBot) tgBot.textContent=tgLabel(bot) || '未设置';
    if(em) em.textContent=mail || '未设置';
    if(contactLink){contactLink.href=tgUrl(personal || settings.contact_url); contactLink.style.display=(personal || settings.contact_url)?'inline-block':'none';}
    if(groupLink){groupLink.href=tgUrl(group); groupLink.style.display=group?'inline-block':'none';}
    if(botLink){botLink.href=tgUrl(bot); botLink.style.display=bot?'inline-block':'none';}
    if(emailLink){emailLink.href=mail?'mailto:'+mail:'#'; emailLink.style.display=mail?'inline-block':'none';}
  }
  function renderHero(){
    const url=settings.announcement_image_url;
    if(!url) return;
    const img=new Image();
    img.onload=()=>{
      if(img.naturalWidth&&img.naturalHeight) hero.style.aspectRatio=img.naturalWidth+'/'+img.naturalHeight;
      hero.style.backgroundImage=`url("${String(url).replace(/"/g,'%22')}")`;
      hero.style.backgroundSize='100% 100%';
      hero.classList.add('has');
    };
    img.onerror=()=>{};
    img.src=url;
  }
  async function load(){
    try{
      const r=await fetch(API);
      if(!r.ok)throw 0;
      const d=await r.json();
      games=(d.games||[]).filter(g=>g.enabled===undefined||g.enabled);
      settings=d.settings||{};
      [renderGameLoop,renderGames,renderNotice,renderServiceTime,renderHero,renderSiteSettings].forEach(f=>{try{f()}catch(err){console.error(err)}});
    }catch(e){
      renderGameLoop();
      renderGames();
    }
  }
  const pause=()=>{loopBusy=true};
  const resume=()=>{loopBusy=false};
  ['touchstart','pointerdown'].forEach(ev=>loopStrip.addEventListener(ev,pause,{passive:true}));
  ['touchend','pointerup','pointercancel','touchcancel'].forEach(ev=>loopStrip.addEventListener(ev,resume,{passive:true}));
  loopStrip.addEventListener('mouseenter',pause);
  loopStrip.addEventListener('mouseleave',resume);
  [[contactLink,tg],[groupLink,tgGroup],[botLink,tgBot]].forEach(([a,t])=>{if(a&&t&&/^@/.test(t.textContent.trim()))a.href=tgUrl(t.textContent)});
  const fab=document.getElementById('csFab');
  const modal=document.getElementById('csModal');
  function openCs(){modal.classList.add('open');modal.setAttribute('aria-hidden','false');document.body.style.overflow='hidden';}
  function closeCs(){modal.classList.remove('open');modal.setAttribute('aria-hidden','true');document.body.style.overflow='';}
  fab.addEventListener('click',openCs);
  modal.addEventListener('click',e=>{if(e.target===modal||e.target.closest('[data-close]'))closeCs();});
  document.addEventListener('keydown',e=>{if(e.key==='Escape')closeCs();});
  load();
})();
</script>
</body></html>
